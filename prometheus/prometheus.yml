global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

scrape_configs:
  - job_name: 'sample-app'
    static_configs:
      - targets: ['localhost:5000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']